<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에이번리 마을 지도</title>
<meta name="screen-orientation" content="landscape">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6ecd6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate" role="alert"><div class="ph"></div><b>휴대폰을 가로로 돌려 주세요</b><p>에이번리 마을은 넓어서<br>옆으로 눕혀야 잘 보여요.</p></div>
<div id="game">
  <div class="hud"><span class="t" id="hudT">에이번리 마을 지도</span><span class="heart" id="hudH" hidden></span><span class="sp"></span>
    <button id="bBag" hidden title="가방" aria-label="가방">🎒<span class="tx"> 가방</span></button>
    <button id="bMap" hidden title="지도로" aria-label="지도로">🗺️<span class="tx"> 지도</span></button>
    <button id="bMusic" title="음악" aria-label="음악 켜고 끄기">♪</button></div>

  <section class="screen" id="map"><div class="mw" id="mw">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="에이번리 마을 지도">
      <defs>
        <filter id="wc"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
        <filter id="pp"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .42 0 0 0 0 .28 0 0 0 .12 0"/></filter>
        <radialGradient id="lake" cx=".5" cy=".45"><stop offset="0" stop-color="#cfe9ef"/><stop offset="1" stop-color="#7fb0c4"/></radialGradient>
        <g id="tree"><ellipse cx="0" cy="22" rx="20" ry="6" fill="#5a4630" opacity=".2"/><rect x="-3" y="0" width="6" height="22" fill="#7a5a3e"/><circle r="22" cy="-6" fill="#6f9e5e"/><circle r="14" cx="-8" cy="-12" fill="#86b46f"/></g>
        <g id="fir"><path d="M0-40 L-18 18 H18Z" fill="#3f6a52"/><rect x="-3" y="18" width="6" height="8" fill="#6b4e3a"/></g>
        <g id="birch"><rect x="-3" y="-30" width="6" height="52" fill="#f4f1e8" stroke="#9a9080" stroke-width="1"/><circle r="15" cy="-34" fill="#a9c97a"/></g>
        <g id="bloom"><circle r="16" fill="#fbf3f5"/><circle r="10" cx="9" cy="-6" fill="#f4dfe6"/><circle r="9" cx="-9" cy="-4" fill="#ffffff"/></g>
      </defs>
      <g id="land">
        <image id="mapImg" href="img/map_spring.webp" width="1600" height="900" preserveAspectRatio="none"/>
        <rect id="season" width="1600" height="900" fill="#fff" opacity="0"/>
        <g id="snow"></g>
      </g>
      <path id="guide" d="" fill="none"/><path id="trail" d="" fill="none"/>
      <g id="names" font-family="Gowun Batang,serif" font-weight="700" font-size="28" fill="#4a3626" text-anchor="middle" paint-order="stroke" stroke="#fbf3e2" stroke-width="7"></g>
      <g id="pins"></g>
      <g id="me"><ellipse cx="0" cy="0" rx="22" ry="7" fill="#3e2c1e" opacity=".22"/><g id="meBody"><image id="meImg" href="img/walk_anne.webp" x="-35" y="-140" width="70" height="140"/></g></g>
    </svg></div>
    <div class="quest" id="quest"></div>
  </section>

  <section class="screen" id="place">
    <div class="scene" id="bg"></div>
    <img class="spr l off" id="sL" alt=""><img class="spr r off" id="sR" alt="">
    <div class="duel" id="duel"><span id="duelN">마음</span><span>꽁꽁</span><div class="bar"><i id="duelBar"></i></div><span>사르르</span></div>
    <div class="box" id="box"><span class="who" id="who"></span><div class="bi"><div class="txt" id="txt"></div><div id="ch"></div></div><div class="next" id="nx">▼ 눌러서 계속</div></div>
  </section>

  <section class="screen" id="mini">
    <div class="road" id="road"></div><img class="cart" src="img/mini_cart.webp" alt="">
    <div class="mhud" id="mh"></div>
    <div id="field"></div>
  </section>

  <div class="card on" id="cover"><div class="in">
    <img class="big" src="img/ch1_avenue.webp" alt="">
    <h1>에이번리 마을 지도</h1>
    <p>앤이 되어 마을을 돌아다니며 사람들을 만나고,<br>예쁜 곳마다 이름을 붙여 보세요.</p>
    <button class="big-btn" id="bStart">이야기 시작하기</button>
    <div class="btns" id="coverMore"></div>
    <p style="font-size:13px;margin-top:10px">열 개의 장 · 앤의 이야기를 끝까지 따라가요</p>
  </div></div>
  <div class="card" id="pop"><div class="in" id="popIn"></div></div>
  <div class="toast" id="toast"></div>
  <span class="maker">하늘소</span>
</div>

<script src="js/engine.js"></script>
<script src="js/mini.js"></script>
<script src="js/ch1.js"></script>
<script src="js/ch2.js"></script>
<script src="js/ch3.js"></script>
<script src="js/ch4.js"></script>
<script src="js/ch5.js"></script>
<script src="js/ch6.js"></script>
<script src="js/ch7.js"></script>
<script src="js/ch8.js"></script>
<script src="js/ch9.js"></script>
<script src="js/ch10.js"></script>
<script src="js/say.js"></script>
<script>GAME.boot();</script>
</body>
</html>
