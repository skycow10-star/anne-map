<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글씨체 시안 · 앤의 에이번리 산책</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" rel="stylesheet">
<style>
body{margin:0;background:#2f2418;color:#3e2c1e;font-family:system-ui,sans-serif;padding:12px}
h1{color:#f6ecd8;font-size:18px;margin:4px 4px 12px}
.set{margin:0 auto 22px;max-width:900px}
.lab{color:#f6ecd8;font-size:15px;margin:0 4px 6px}
.lab b{background:#c8552f;color:#fff;border-radius:999px;padding:1px 10px;margin-right:6px}
.scene{position:relative;aspect-ratio:844/390;border-radius:12px;overflow:hidden;background:url(img/ch1.webp) center/cover}
.spr{position:absolute;bottom:-6%;left:8%;height:98%}
.title{position:absolute;left:12px;top:10px;background:rgba(255,250,240,.92);border:1.5px solid #d9c3a0;border-radius:999px;padding:2px 12px;font-size:clamp(11px,1.8vw,15px);font-weight:700}
.opts{position:absolute;left:0;right:0;top:12%;display:flex;flex-direction:column;align-items:center;gap:6px}
.opts span{width:min(70%,560px);text-align:center;background:#fffaf0;border:3px solid #c9a56f;border-radius:999px;padding:5px 14px;font-size:clamp(12px,2vw,17px);font-weight:700;box-shadow:0 3px 0 #a9814f}
.box{position:absolute;left:10px;right:10px;bottom:8px;background:#fffaf0;border:3px solid #a9814f;border-radius:14px;padding:8px 16px 10px}
.who{display:inline-block;background:#9b6fb5;color:#fff;border-radius:999px;padding:1px 12px;font-size:clamp(11px,1.6vw,14px);font-weight:700}
.txt{font-size:clamp(13px,2.2vw,20px);line-height:1.6;color:#2a1c10;margin-top:2px}
.dim::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
/* 조합 */
.A .t{font-family:"Gowun Batang",serif}.A .b{font-family:"Gowun Dodum",sans-serif}
.B .t{font-family:"MaruBuri",serif}.B .b{font-family:"NanumSquareRound",sans-serif}
.C .t{font-family:"Jua",sans-serif;font-weight:400!important}.C .b{font-family:"NanumSquareRound",sans-serif}
.D .t{font-family:"MaruBuri",serif}.D .b{font-family:"MaruBuri",serif}
</style>
</head>
<body>
<h1>글씨체 시안 — 마음에 드는 번호를 알려 주세요</h1>

<script>
const sets = [
  ["A", "지금 글씨체", "제목 고운바탕 · 본문 고운돋움"],
  ["B", "추천", "제목 마루부리 · 본문 나눔스퀘어라운드"],
  ["C", "귀엽게", "제목 주아 · 본문 나눔스퀘어라운드"],
  ["D", "동화책처럼", "제목·본문 모두 마루부리"]
];
document.write(sets.map(([k, tag, name]) => `
<div class="set ${k}">
  <p class="lab"><b>${k}</b>${tag} · ${name}</p>
  <div class="scene">
    <img class="spr" src="img/anne_happy.webp" alt="">
    <span class="title t">1장 · 기차역의 기다림</span>
    <div class="box"><span class="who t">앤 (속마음)</span>
      <div class="txt b">나는 앤 셜리, 열한 살이야.<br>오늘 고아원을 떠나 기차를 타고 브라이트 리버 역에 왔어.</div></div>
  </div>
  <div class="scene dim" style="margin-top:8px">
    <span class="title t">1장 · 기차역의 기다림</span>
    <div class="opts"><span class="t">고맙지만 밖에서 기다릴래요. 밖이 상상할 게 더 많거든요!</span><span class="t">철길 모퉁이의 하얀 벚나무에 올라가 본다.</span><span class="t">역장님 말씀대로 대합실에 들어가 얌전히 기다린다.</span></div>
    <div class="box"><span class="who t" style="background:#a07a3a">선택의 순간</span>
      <div class="txt b" style="font-weight:700">역장님이 대합실에 들어가 있으래요. 앤은 어디서 기다릴까요?</div></div>
  </div>
</div>`).join(""));
</script>
</body>
</html>
